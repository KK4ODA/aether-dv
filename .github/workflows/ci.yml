# Continuous integration.
# Pushes: full checks on Linux only (cheap). Pull requests and manual runs:
# the cross-platform test matrix as well. macOS minutes bill at 10x on
# private repositories, so the matrix is not run on every push.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Radio setup guides
        run: python3 app/tools/check_guides.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --test-threads=1

  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API schema checks
        run: python3 spec/api/check_api.py
      - name: Storage schema checks
        run: python3 spec/storage/check_schema.py
      - name: Legacy ARQ model (finds the known wrap defect)
        run: |
          set +e
          python3 spec/models/legacy_arq_check.py --mod 4 --blocks 6 --window 2 --chan 4 --receiver legacy
          test $? -eq 1 || { echo "expected the legacy model to report a violation"; exit 1; }
      - name: ALP span rule model (must pass exhaustively)
        run: python3 spec/models/legacy_arq_check.py --mod 4 --blocks 6 --window 2 --chan 4 --receiver windowed --span-limit

  matrix:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The serial PTY tests are Unix-only; on Windows the codec tests run.
      - run: cargo test --workspace --locked -- --test-threads=1
