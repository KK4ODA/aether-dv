# Build installable packages for all three platforms (Phase B spike: the
# empty shell). Manual, version tags, or package/** branches only, to save
# Actions minutes.
# Unsigned for now: Windows Authenticode and Apple notarisation need
# certificates the project does not have yet (Phase F).
name: package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Pushing a branch named package/<anything> runs packaging once without a
    # release tag (workflow_dispatch only works once this file is on main).
    branches: ["package/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: macos-14
            bundles: app,dmg
          - os: windows-2022
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build bundles
        working-directory: app/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: aether-dv-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
